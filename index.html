<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스도쿠</title>
<style>
  :root {
    --cell-size: clamp(30px, 8.6vw, 52px);
    --border-thin: 1px solid #bbb;
    --border-thick: 3px solid #333;
    --panel-bg:  #F8EFD8;
    --easy:      #5A9C34;
    --easy-dark: #2C7819;
    --normal:    #FCEFCD;
    --hard:      #FAC5BD;
    --overlay:   rgba(18, 30, 45, .28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f2f2f2;
    min-height: 100vh;
  }

  /* ---------- 화면 전환 ---------- */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    min-height: 100vh;
    padding: 16px 10px 40px;
  }
  .screen.active { display: flex; }

  #homeScreen.active {
    background: linear-gradient(180deg, #e3f7ea 0%, #dbf1e0 45%, #cdeaca 100%);
  }

  /* ---------- 홈 헤더 (배경 너비를 따라가는 줄) ---------- */
  #homeHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 10px;
    width: 100%;
    margin: 0 0 14px;
  }

  /* ---------- 난이도 선택 ---------- */
  #difficultySelector {
    display: flex;
    flex-direction: row;
    gap: 10px;
    flex-wrap: wrap;
  }
  .diff-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 18px;
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: 700;
    border: 2px solid var(--easy-dark);
    border-radius: 16px;
    background: var(--panel-bg);
    color: #5c4a32;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }
  .diff-tab-stars {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.85;
  }
  .diff-tab:hover { transform: translateY(-1px); }
  .diff-tab.active[data-diff="easy"]   { background: var(--easy); border-color: var(--easy-dark); color: #fff; }
  .diff-tab.active[data-diff="medium"] { background: var(--normal); border-color: var(--easy-dark); color: #5c4a32; }
  .diff-tab.active[data-diff="hard"]   { background: var(--hard); border-color: var(--easy-dark); color: #7a2e22; }
  .diff-tab.locked { opacity: 0.65; }

  .home-toast {
    margin: -10px 0 16px;
    padding: 9px 14px;
    background: rgba(55, 71, 79, 0.92);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    text-align: center;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .home-toast.show { opacity: 1; transform: translateY(0); }

  #homeContent { width: 100%; max-width: 420px; }

  @media (min-width: 769px) {
    #homeContent { max-width: 640px; }
  }

  @media (min-width: 1440px) {
    /* 105vh 항: 배경 종횡비(1487:1058)상 뷰포트 높이를 넘어 스크롤이 생기지 않도록 폭을 제한 */
    #homeContent { max-width: min(1440px, 80vw, 105vh); }
  }

  /* ---------- 스테이지 맵 (배경 이미지 위 절대 위치) ---------- */
  #stageMapWrap { position: relative; display: flex; justify-content: center; width: 100%; margin: 6px 0 20px; }
  .title-logo {
    position: absolute;
    top: 3%;
    left: 3%;
    width: 30%;
    height: auto;
    z-index: 5;
    pointer-events: none;
  }
  .sign-board {
    position: absolute;
    bottom: 3%;
    right: 3%;
    width: 18%;
    height: auto;
    z-index: 5;
    pointer-events: none;
  }
  #stageMap {
    position: relative;
    width: 100%;
    aspect-ratio: 1080 / 1920;
    border-radius: 14px;
    overflow: hidden;
    background-image: url('assets/bg/bg-mobile.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  @media (min-width: 768px) {
    #stageMap {
      aspect-ratio: 1487 / 1058;
      background-image: url('assets/bg/bg-desktop.webp');
    }
  }
  #stageMap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--overlay);
    z-index: 1;
    pointer-events: none;
  }

  .stage-stone-wrap {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage-stars {
    margin-top: 3px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #ffb300;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
  }

  .stage-stone {
    position: relative;
    width: 64px; /* JS sets the real size from #stageMap's rendered width — see renderStageMap() */
    aspect-ratio: 1;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.18s ease;
  }
  .stage-stone img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .stage-stone .stage-fx-img { z-index: 0; }
  .stage-stone .stage-stone-img { z-index: 1; }
  .stage-stone .stage-lock-badge {
    width: 30%;
    height: 30%;
    inset: 0 auto auto 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  .stage-stone:hover, .stage-stone:focus-visible { transform: translateY(-8%); }
  .stage-stone:active { transform: translateY(-3%); }

  .stage-stone.locked { cursor: not-allowed; }
  .stage-stone.locked:hover, .stage-stone.locked:focus-visible { transform: none; }

  .stage-stone.next .stage-stone-img,
  .stage-stone.next .stage-fx-img {
    animation: nextStonePulse 1.8s ease-in-out infinite;
  }
  @keyframes nextStonePulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 213, 79, 0)); }
    50%      { filter: drop-shadow(0 0 6px rgba(255, 213, 79, 0.85)); }
  }

  /* ---------- 게임 화면 헤더 ---------- */
  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    gap: 8px;
    margin-bottom: 12px;
  }
  .back-btn {
    padding: 8px 14px;
    font-size: clamp(12px, 3.2vw, 14px);
    border: 1px solid #999;
    border-radius: 8px;
    background: #fff;
    color: #333;
    cursor: pointer;
    white-space: nowrap;
  }
  .back-btn:hover { background: #eee; }
  .location-label {
    flex: 1;
    text-align: center;
    font-weight: bold;
    color: #37474f;
    font-size: clamp(13px, 3.6vw, 16px);
  }
  .timer-label {
    font-variant-numeric: tabular-nums;
    font-weight: bold;
    color: #1565c0;
    background: #e3f2fd;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: clamp(13px, 3.6vw, 15px);
    min-width: 62px;
    text-align: center;
    white-space: nowrap;
  }

  .status-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
    font-size: clamp(12px, 3.2vw, 14px);
    color: #444;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(9, var(--cell-size));
    grid-template-rows: repeat(9, var(--cell-size));
    border: var(--border-thick);
    background: #fff;
    user-select: none;
    touch-action: manipulation;
  }
  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell-size) * 0.42);
    border-right: var(--border-thin);
    border-bottom: var(--border-thin);
    cursor: pointer;
    color: #1565c0;
    background: #fff;
  }
  .cell.given { color: #222; font-weight: bold; background: #f7f7f7; }
  .cell:nth-child(9n+3) { border-right: var(--border-thick); }
  .cell:nth-child(9n+6) { border-right: var(--border-thick); }
  .cell:nth-child(9n) { border-right: none; }
  .row-thick-bottom { border-bottom: var(--border-thick) !important; }

  .cell.peer { background: #eef4fc; }
  .cell.same-number { background: #ffe0b2; }
  .cell.given.same-number { background: #ffcc80; }
  .cell.selected { background: #bbdefb; }
  .cell.given.peer { background: #eceff1; }
  .cell.given.selected { background: #b0bec5; }

  .cell.conflict { color: #d32f2f; background: #ffebee; }
  .cell.given.conflict { background: #ffcdd2; }
  .cell.conflict.selected { background: #ef9a9a; }
  .cell.conflict.same-number { background: #ffab91; }

  .cell .value { position: relative; z-index: 1; }

  .cell .notes {
    position: absolute;
    top: 1px;
    right: 2px;
    left: 2px;
    text-align: right;
    line-height: 1.05;
    font-size: calc(var(--cell-size) * 0.19);
    color: #607d8b;
    font-weight: normal;
    pointer-events: none;
    word-break: break-all;
  }

  #numpad {
    display: grid;
    grid-template-columns: repeat(5, var(--cell-size));
    gap: 6px;
    margin-top: 16px;
  }
  #numpad button {
    width: var(--cell-size);
    height: var(--cell-size);
    font-size: calc(var(--cell-size) * 0.36);
    border: 1px solid #999;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  #numpad button:hover { background: #e0e0e0; }
  #numpad button.erase { font-size: calc(var(--cell-size) * 0.22); background: #fafafa; }
  #numpad button:disabled {
    background: #e0e0e0;
    color: #aaa;
    cursor: not-allowed;
    opacity: 0.55;
  }
  #numpad button:disabled:hover { background: #e0e0e0; }

  #modeBar {
    margin-top: 12px;
    display: flex;
    gap: 10px;
  }
  #memoToggle {
    padding: 9px 16px;
    font-size: 14px;
    border: 2px solid #1565c0;
    border-radius: 6px;
    background: #fff;
    color: #1565c0;
    cursor: pointer;
    font-weight: bold;
  }
  #memoToggle.active {
    background: #1565c0;
    color: #fff;
  }

  #controls {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #controls button {
    padding: 10px 18px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background: #455a64;
    color: #fff;
    cursor: pointer;
  }
  #controls button:hover { background: #37474f; }

  #message {
    margin-top: 14px;
    font-size: 16px;
    font-weight: bold;
    min-height: 22px;
    color: #2e7d32;
    text-align: center;
  }

  @media (max-width: 380px) {
    #numpad { gap: 4px; }
    #controls button { padding: 8px 12px; font-size: 13px; }
  }

  .reset-progress-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    border: 2px solid #6E3E13;
    border-radius: 999px;
    background: linear-gradient(180deg, #B4762F 0%, #96581F 100%);
    box-shadow: 0 0 0 3px #fff, 0 3px 6px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .35);
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .reset-progress-btn:hover { filter: brightness(1.1); }
  .reset-progress-btn:active { transform: translateY(1px); }
  .reset-icon { width: 14px; height: 14px; flex-shrink: 0; }

  #winOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 32, 0.28);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  #winOverlay.show { display: flex; }

  .confetti-piece {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 1;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-iteration-count: 1;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) rotate(720deg); opacity: 0.85; }
  }

  .win-popup {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 18px;
    padding: 36px 32px 30px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    animation: popupPop 0.35s ease;
  }
  @keyframes popupPop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .win-title {
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 800;
    margin: 0 0 8px;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6bcb, #ff6b6b);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sparkleShift 2.5s linear infinite;
  }
  @keyframes sparkleShift {
    to { background-position: 400% 0; }
  }

  .win-subtitle {
    margin: 0 0 10px;
    color: #263238;
    font-size: 15px;
    font-weight: 600;
  }

  .win-stars {
    margin: 0 0 10px;
    font-size: 30px;
    letter-spacing: 3px;
    color: #ffb300;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  }

  .win-new-record {
    margin: 0 0 10px;
    color: #d84315;
    font-size: 15px;
    font-weight: 800;
  }

  .win-time {
    margin: 0 0 4px;
    color: #1565c0;
    font-size: 14px;
    font-weight: 700;
  }
  .win-time:last-of-type { margin-bottom: 22px; }

  .win-newgame-btn {
    padding: 11px 22px;
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #1565c0;
    color: #fff;
    cursor: pointer;
  }
  .win-newgame-btn:hover { background: #0d47a1; }
</style>
</head>
<body>

<section id="homeScreen" class="screen active">
  <div id="homeContent">
    <div id="homeHeader">
      <div id="difficultySelector"></div>
      <button id="resetProgressBtn" class="reset-progress-btn">
        <svg class="reset-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11A8 8 0 1 0 18.5 16"/>
          <polyline points="20 4 20 11 13 11"/>
        </svg>
        <span>진행도 초기화</span>
      </button>
    </div>
    <div id="homeToast" class="home-toast"></div>
    <div id="stageMapWrap">
      <div id="stageMap"></div>
      <img class="title-logo" src="assets/ui/title-logo.webp" alt="SUDOKU Journey">
      <img class="sign-board" src="assets/ui/sign-board.webp" alt="">
    </div>
  </div>
</section>

<section id="gameScreen" class="screen">
  <div class="game-header">
    <button id="backBtn" class="back-btn">← 뒤로</button>
    <div id="locationLabel" class="location-label"></div>
    <div id="timerLabel" class="timer-label">00:00</div>
  </div>

  <div class="status-bar">
    <span id="filledCount"></span>
  </div>

  <div id="board"></div>

  <div id="numpad"></div>

  <div id="modeBar">
    <button id="memoToggle">✏️ 메모</button>
  </div>

  <div id="controls">
    <button id="resetBtn">리셋</button>
  </div>

  <div id="message"></div>
</section>

<div id="winOverlay">
  <div class="win-popup">
    <div class="win-title">🎉 축하합니다! 🎉</div>
    <p class="win-subtitle">스도쿠를 완성했습니다!</p>
    <div id="winStars" class="win-stars"></div>
    <p id="winNewRecord" class="win-new-record" style="display:none;">🏆 신기록!</p>
    <p id="winThisTime" class="win-time"></p>
    <p id="winBestTime" class="win-time"></p>
    <button id="winNewGameBtn" class="win-newgame-btn">스테이지 목록으로</button>
  </div>
</div>

<script>
(function () {
  const SIZE = 9;
  const FULL_MASK = 0x1FF;
  const STAGE_COUNT = 5;

  // 난이도: 남는(채워진) 칸 수 범위. 실측 결과 easy/medium/hard 모두
  // 아래 범위에서 안정적으로(수 ms 내) 유일해 퍼즐이 생성됨을 확인함.
  const DIFFICULTIES = {
    easy:   { label: '쉬움', minFilled: 40, maxFilled: 46 },
    medium: { label: '보통', minFilled: 30, maxFilled: 35 },
    hard:   { label: '어려움', minFilled: 24, maxFilled: 26 }
  };

  // 난이도별 별점 기준(초). [3점 컷, 2점 컷] 이내면 해당 별점, 아니면 1점.
  const STAR_TIME_THRESHOLDS = {
    easy:   [180, 360],
    medium: [360, 720],
    hard:   [720, 1500]
  };
  const UNLOCK_STAR_REQUIREMENT = 7;
  const PROGRESS_STORAGE_KEY = 'sudoku_progress';

  let currentDifficulty = 'easy'; // 홈 화면에서 선택 중인 난이도
  let currentStage = null;        // 현재 플레이 중인 스테이지 번호
  let solutionBoard = null;
  let puzzleBoard = null;   // 0 = 빈칸
  let givenMask = null;     // true면 원래 문제에서 채워진(수정 불가) 칸
  let userBoard = null;     // 사용자가 실제로 입력 중인 값
  let notesBoard = null;    // [row][col] = Set<number> (메모 후보 숫자)
  let selected = null;      // {row, col}
  let memoMode = false;

  // ---------- 시드 기반 난수 (같은 스테이지 = 항상 같은 퍼즐) ----------

  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function createStageRng(difficultyKey, stageNumber) {
    return mulberry32(hashSeed(`${difficultyKey}-${stageNumber}`));
  }

  // ---------- 스도쿠 생성/검증 로직 (비트마스크 + MRV 백트래킹) ----------

  function createEmptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function boxIndex(r, c) { return Math.floor(r / 3) * 3 + Math.floor(c / 3); }
  function popcount(x) { let c = 0; while (x) { x &= x - 1; c++; } return c; }

  function isValidPlacement(board, row, col, num) {
    for (let i = 0; i < SIZE; i++) {
      if (board[row][i] === num) return false;
      if (board[i][col] === num) return false;
    }
    const boxRow = Math.floor(row / 3) * 3;
    const boxCol = Math.floor(col / 3) * 3;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (board[boxRow + r][boxCol + c] === num) return false;
      }
    }
    return true;
  }

  function findEmptyCell(board) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (board[r][c] === 0) return [r, c];
      }
    }
    return null;
  }

  // 시드 순서로 채워서 완성 스도쿠 보드 생성 (생성 1회이므로 단순 백트래킹으로 충분)
  function fillBoardRandomly(board, rng) {
    const empty = findEmptyCell(board);
    if (!empty) return true;
    const [row, col] = empty;
    const nums = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9], rng);
    for (const num of nums) {
      if (isValidPlacement(board, row, col, num)) {
        board[row][col] = num;
        if (fillBoardRandomly(board, rng)) return true;
        board[row][col] = 0;
      }
    }
    return false;
  }

  function generateSolvedBoard(rng) {
    const board = createEmptyBoard();
    fillBoardRandomly(board, rng);
    return board;
  }

  // 해의 개수를 limit개까지만 세고 조기 종료 (유일해 검증용).
  // 후보가 가장 적은 칸부터 채우는 MRV 휴리스틱 + 비트마스크로,
  // 칸이 25개 안팎으로 적은 "어려움" 난이도에서도 충분히 빠르게 동작함.
  function countSolutions(board, limit) {
    const rowMask = new Array(SIZE).fill(0);
    const colMask = new Array(SIZE).fill(0);
    const boxMask = new Array(SIZE).fill(0);
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (v) {
          const bit = 1 << (v - 1);
          rowMask[r] |= bit; colMask[c] |= bit; boxMask[boxIndex(r, c)] |= bit;
        }
      }
    }

    let count = 0;

    function backtrack() {
      if (count >= limit) return;
      let bestR = -1, bestC = -1, bestCand = 0, bestCount = 10;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] !== 0) continue;
          const used = rowMask[r] | colMask[c] | boxMask[boxIndex(r, c)];
          const cand = FULL_MASK & ~used;
          const cnt = popcount(cand);
          if (cnt === 0) return; // 막다른 길
          if (cnt < bestCount) {
            bestCount = cnt; bestR = r; bestC = c; bestCand = cand;
            if (cnt === 1) break;
          }
        }
        if (bestCount === 1) break;
      }
      if (bestR === -1) { count++; return; } // 빈 칸 없음 = 해 하나 발견

      const bIdx = boxIndex(bestR, bestC);
      let cand = bestCand;
      while (cand) {
        if (count >= limit) return;
        const bit = cand & (-cand);
        cand ^= bit;
        const num = Math.log2(bit) + 1;
        board[bestR][bestC] = num;
        rowMask[bestR] |= bit; colMask[bestC] |= bit; boxMask[bIdx] |= bit;
        backtrack();
        board[bestR][bestC] = 0;
        rowMask[bestR] &= ~bit; colMask[bestC] &= ~bit; boxMask[bIdx] &= ~bit;
      }
    }

    backtrack();
    return count;
  }

  function cloneBoard(board) { return board.map(row => row.slice()); }

  function generatePuzzle(difficultyKey, rng) {
    const { minFilled, maxFilled } = DIFFICULTIES[difficultyKey];
    const solution = generateSolvedBoard(rng);
    const puzzle = cloneBoard(solution);

    const positions = shuffle(Array.from({ length: SIZE * SIZE }, (_, i) => i), rng);

    let filledCount = SIZE * SIZE;
    const target = minFilled + Math.floor(rng() * (maxFilled - minFilled + 1));

    for (const pos of positions) {
      if (filledCount <= target) break;
      const row = Math.floor(pos / SIZE);
      const col = pos % SIZE;
      if (puzzle[row][col] === 0) continue;

      const backup = puzzle[row][col];
      puzzle[row][col] = 0;

      const testBoard = cloneBoard(puzzle);
      const solutions = countSolutions(testBoard, 2);

      if (solutions === 1) {
        filledCount--;
      } else {
        puzzle[row][col] = backup; // 유일해가 깨지면 되돌림
      }
    }

    return { puzzle, solution, filledCount };
  }

  // ---------- 진행도 저장 (localStorage) ----------

  function createEmptyProgress() {
    return { stages: { easy: {}, medium: {}, hard: {} } };
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);
      if (!raw) return createEmptyProgress();
      const parsed = JSON.parse(raw);
      const result = createEmptyProgress();
      Object.keys(result.stages).forEach(diff => {
        Object.assign(result.stages[diff], (parsed.stages && parsed.stages[diff]) || {});
      });
      return result;
    } catch (e) {
      return createEmptyProgress();
    }
  }

  let progress = loadProgress();

  function saveProgress() {
    localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(progress));
  }

  function resetProgress() {
    localStorage.removeItem(PROGRESS_STORAGE_KEY);
    progress = createEmptyProgress();
  }

  function computeStars(difficultyKey, seconds) {
    const [threeStarCut, twoStarCut] = STAR_TIME_THRESHOLDS[difficultyKey];
    if (seconds <= threeStarCut) return 3;
    if (seconds <= twoStarCut) return 2;
    return 1;
  }

  function getStageRecord(difficultyKey, stageNumber) {
    return progress.stages[difficultyKey][stageNumber] || null;
  }

  function getDifficultyStars(difficultyKey) {
    let total = 0;
    for (let s = 1; s <= STAGE_COUNT; s++) {
      const rec = progress.stages[difficultyKey][s];
      if (rec && rec.cleared) total += rec.stars;
    }
    return total;
  }

  function getDifficultyClearedCount(difficultyKey) {
    let count = 0;
    for (let s = 1; s <= STAGE_COUNT; s++) {
      const rec = progress.stages[difficultyKey][s];
      if (rec && rec.cleared) count++;
    }
    return count;
  }

  function isDifficultyUnlocked(difficultyKey) {
    if (difficultyKey === 'easy') return true;
    if (difficultyKey === 'medium') return getDifficultyStars('easy') >= UNLOCK_STAR_REQUIREMENT;
    if (difficultyKey === 'hard') return getDifficultyStars('medium') >= UNLOCK_STAR_REQUIREMENT;
    return false;
  }

  function isStageUnlocked(difficultyKey, stageNumber) {
    if (!isDifficultyUnlocked(difficultyKey)) return false;
    if (stageNumber === 1) return true;
    const prev = getStageRecord(difficultyKey, stageNumber - 1);
    return !!(prev && prev.cleared);
  }

  // 현재 도전해야 할 스테이지(잠기지 않았고 아직 클리어하지 않은 첫 스테이지)
  function getNextChallengeStage(difficultyKey) {
    for (let s = 1; s <= STAGE_COUNT; s++) {
      if (!isStageUnlocked(difficultyKey, s)) continue;
      const rec = getStageRecord(difficultyKey, s);
      if (!rec || !rec.cleared) return s;
    }
    return null;
  }

  // 클리어 시점에만 호출. 더 좋은 기록일 때만 별점/최고 기록 갱신.
  function recordCompletion(difficultyKey, stageNumber, seconds) {
    const existing = getStageRecord(difficultyKey, stageNumber);
    const isNewRecord = !existing || seconds < existing.bestTime;

    if (!existing) {
      progress.stages[difficultyKey][stageNumber] = {
        cleared: true,
        stars: computeStars(difficultyKey, seconds),
        bestTime: seconds
      };
    } else if (seconds < existing.bestTime) {
      existing.stars = computeStars(difficultyKey, seconds);
      existing.bestTime = seconds;
    }

    saveProgress();

    const rec = getStageRecord(difficultyKey, stageNumber);
    return { stars: rec.stars, bestTime: rec.bestTime, thisTime: seconds, isNewRecord };
  }

  function starString(stars) {
    return '★'.repeat(stars) + '☆'.repeat(3 - stars);
  }

  // ---------- 화면/DOM 참조 ----------

  const homeScreen = document.getElementById('homeScreen');
  const gameScreen = document.getElementById('gameScreen');
  const difficultySelectorEl = document.getElementById('difficultySelector');
  const stageMapEl = document.getElementById('stageMap');
  const homeToastEl = document.getElementById('homeToast');
  const resetProgressBtn = document.getElementById('resetProgressBtn');
  const backBtn = document.getElementById('backBtn');
  const locationLabelEl = document.getElementById('locationLabel');
  const timerLabelEl = document.getElementById('timerLabel');

  const boardEl = document.getElementById('board');
  const numpadEl = document.getElementById('numpad');
  const messageEl = document.getElementById('message');
  const filledCountEl = document.getElementById('filledCount');
  const memoToggleBtn = document.getElementById('memoToggle');
  const winOverlay = document.getElementById('winOverlay');
  const winStarsEl = document.getElementById('winStars');
  const winNewRecordEl = document.getElementById('winNewRecord');
  const winThisTimeEl = document.getElementById('winThisTime');
  const winBestTimeEl = document.getElementById('winBestTime');
  const winNewGameBtn = document.getElementById('winNewGameBtn');
  const numberButtons = {}; // num -> button element

  // ---------- 타이머 ----------

  let timerInterval = null;
  let elapsedSeconds = 0;

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function formatTime(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${pad2(m)}:${pad2(s)}`;
  }

  function startTimer() {
    stopTimer();
    elapsedSeconds = 0;
    timerLabelEl.textContent = formatTime(0);
    timerInterval = setInterval(() => {
      elapsedSeconds++;
      timerLabelEl.textContent = formatTime(elapsedSeconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  // ---------- 홈 화면: 난이도 선택 + 스테이지 맵 ----------

  let homeToastTimer = null;
  function showHomeToast(text) {
    homeToastEl.textContent = text;
    homeToastEl.classList.add('show');
    clearTimeout(homeToastTimer);
    homeToastTimer = setTimeout(() => homeToastEl.classList.remove('show'), 2600);
  }

  function lockedDifficultyMessage(difficultyKey) {
    if (difficultyKey === 'medium') {
      return `${DIFFICULTIES.easy.label}에서 별 ${UNLOCK_STAR_REQUIREMENT}개를 모으면 열려요 (현재 ${getDifficultyStars('easy')}개)`;
    }
    if (difficultyKey === 'hard') {
      return `${DIFFICULTIES.medium.label}에서 별 ${UNLOCK_STAR_REQUIREMENT}개를 모으면 열려요 (현재 ${getDifficultyStars('medium')}개)`;
    }
    return '';
  }

  function renderDifficultySelector() {
    difficultySelectorEl.innerHTML = '';
    Object.keys(DIFFICULTIES).forEach(key => {
      const unlocked = isDifficultyUnlocked(key);
      const clearedCount = getDifficultyClearedCount(key);

      const btn = document.createElement('button');
      btn.className = 'diff-tab' + (unlocked ? '' : ' locked');
      btn.dataset.diff = key;
      btn.classList.toggle('active', key === currentDifficulty);

      const labelSpan = document.createElement('span');
      labelSpan.textContent = (unlocked ? '' : '🔒 ') + DIFFICULTIES[key].label;
      const starsSpan = document.createElement('span');
      starsSpan.className = 'diff-tab-stars';
      starsSpan.textContent = `${clearedCount}/${STAGE_COUNT}`;
      btn.appendChild(labelSpan);
      btn.appendChild(starsSpan);

      btn.addEventListener('click', () => {
        if (!unlocked) {
          showHomeToast(lockedDifficultyMessage(key));
          return;
        }
        if (key === currentDifficulty) return;
        currentDifficulty = key;
        renderDifficultySelector();
        renderStageMap();
      });
      difficultySelectorEl.appendChild(btn);
    });
  }

  // ---------- 스테이지 맵 (배경 이미지 위 절대 위치) ----------

  // 배경마다 강의 경로가 달라 좌표가 다르다. index 0 = 마지막 단계(맨 위) ... 마지막 index = 1단계(맨 아래).
  const STAGES = {
    desktop: [
      { x: 77, y: 13, size: 10.0 },
      { x: 63, y: 29, size: 11.0 },
      { x: 57, y: 48, size: 12.5 },
      { x: 41, y: 66, size: 14.0 },
      { x: 32, y: 87, size: 16.0 }
    ],
    mobile: [
      { x: 59, y: 14, size: 14.0 },
      { x: 52, y: 32, size: 14.6 },
      { x: 42, y: 51, size: 15.4 },
      { x: 46, y: 70, size: 16.2 },
      { x: 37, y: 88, size: 17.0 }
    ]
  };

  function getStageCoords() {
    return window.innerWidth >= 768 ? STAGES.desktop : STAGES.mobile;
  }

  // 배경(#stageMap)의 실제 렌더링 너비 대비 sizePercent(%)로 돌 크기를 계산.
  // .stage-stone-wrap이 width:auto인 절대 위치 박스라 %가 순환 참조로 0에
  // 수렴해버리므로(항상 clamp 하한에 고정되는 버그), JS에서 직접 px로 계산해 준다.
  function computeStoneSizePx(sizePercent) {
    const mapWidth = stageMapEl.getBoundingClientRect().width || 300;
    return Math.max(40, Math.min(mapWidth * (sizePercent / 100), 220));
  }

  function renderStageMap() {
    stageMapEl.innerHTML = '';
    const nextStage = getNextChallengeStage(currentDifficulty);
    const coords = getStageCoords();

    for (let stage = 1; stage <= STAGE_COUNT; stage++) {
      const pos = coords[STAGE_COUNT - stage];
      const unlocked = isStageUnlocked(currentDifficulty, stage);
      const record = getStageRecord(currentDifficulty, stage);
      const cleared = !!(record && record.cleared);
      const isNext = unlocked && !cleared && stage === nextStage;

      const wrap = document.createElement('div');
      wrap.className = 'stage-stone-wrap';
      wrap.style.left = pos.x + '%';
      wrap.style.top = pos.y + '%';

      const stone = document.createElement('button');
      stone.type = 'button';
      stone.className = 'stage-stone' + (unlocked ? '' : ' locked') + (isNext ? ' next' : '');
      stone.style.width = computeStoneSizePx(pos.size) + 'px';

      if (!unlocked) {
        const fxImg = document.createElement('img');
        fxImg.className = 'stage-fx-img';
        fxImg.alt = '';
        fxImg.src = 'assets/stones/fx-locked.webp';
        stone.appendChild(fxImg);
      } else if (isNext) {
        const fxImg = document.createElement('img');
        fxImg.className = 'stage-fx-img';
        fxImg.alt = '';
        fxImg.src = 'assets/stones/fx-selected.webp';
        stone.appendChild(fxImg);
      }

      const stoneImg = document.createElement('img');
      stoneImg.className = 'stage-stone-img';
      stoneImg.alt = '';
      stoneImg.src = `assets/stones/stone-${stage}.webp`;
      stone.appendChild(stoneImg);

      if (!unlocked) {
        const lockBadge = document.createElement('img');
        lockBadge.className = 'stage-lock-badge';
        lockBadge.alt = '';
        lockBadge.src = 'assets/stones/icon-lock-sm.webp';
        stone.appendChild(lockBadge);
      }

      if (unlocked) {
        stone.setAttribute('aria-label', `${DIFFICULTIES[currentDifficulty].label} ${stage}단계`);
        stone.addEventListener('click', () => enterStage(currentDifficulty, stage));
      } else {
        stone.disabled = true;
        stone.setAttribute('aria-label', `${DIFFICULTIES[currentDifficulty].label} ${stage}단계 (잠김)`);
      }
      wrap.appendChild(stone);

      if (cleared) {
        const starsEl = document.createElement('div');
        starsEl.className = 'stage-stars';
        starsEl.textContent = starString(record.stars);
        wrap.appendChild(starsEl);
      }

      stageMapEl.appendChild(wrap);
    }
  }

  function goHome() {
    stopTimer();
    hideWinPopup();
    gameScreen.classList.remove('active');
    homeScreen.classList.add('active');
    renderDifficultySelector();
    renderStageMap();
  }

  function enterStage(difficultyKey, stageNumber) {
    if (!isStageUnlocked(difficultyKey, stageNumber)) return;

    currentDifficulty = difficultyKey;
    currentStage = stageNumber;

    messageEl.textContent = '';
    selected = null;
    setMemoMode(false);
    hideWinPopup();

    const rng = createStageRng(difficultyKey, stageNumber);
    const { puzzle, solution } = generatePuzzle(difficultyKey, rng);
    solutionBoard = solution;
    puzzleBoard = puzzle;
    userBoard = cloneBoard(puzzle);
    givenMask = puzzle.map(row => row.map(v => v !== 0));
    notesBoard = Array.from({ length: SIZE }, () => Array.from({ length: SIZE }, () => new Set()));

    locationLabelEl.textContent = `${DIFFICULTIES[difficultyKey].label} · ${stageNumber}단계`;

    homeScreen.classList.remove('active');
    gameScreen.classList.add('active');

    startTimer();
    render();
  }

  // ---------- 게임 화면 렌더링 & 상호작용 ----------

  function buildBoardDom() {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        if (r === 2 || r === 5) cell.classList.add('row-thick-bottom');

        const valueSpan = document.createElement('span');
        valueSpan.className = 'value';
        cell.appendChild(valueSpan);

        const notesDiv = document.createElement('div');
        notesDiv.className = 'notes';
        cell.appendChild(notesDiv);

        cell.addEventListener('click', () => selectCell(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  function buildNumpadDom() {
    numpadEl.innerHTML = '';
    for (let n = 1; n <= 9; n++) {
      const btn = document.createElement('button');
      btn.textContent = n;
      btn.addEventListener('click', () => inputNumber(n));
      numpadEl.appendChild(btn);
      numberButtons[n] = btn;
    }
    const eraseBtn = document.createElement('button');
    eraseBtn.textContent = '지우기';
    eraseBtn.className = 'erase';
    eraseBtn.addEventListener('click', eraseSelected);
    numpadEl.appendChild(eraseBtn);
  }

  function selectCell(row, col) {
    selected = { row, col };
    render();
  }

  function countOnBoard(num) {
    let count = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (userBoard[r][c] === num) count++;
      }
    }
    return count;
  }

  function inputNumber(num) {
    if (!selected) return;
    const { row, col } = selected;
    if (givenMask[row][col]) return;

    if (memoMode) {
      if (userBoard[row][col] !== 0) return; // 값이 이미 있는 칸엔 메모 불가
      const set = notesBoard[row][col];
      if (set.has(num)) set.delete(num); else set.add(num);
    } else {
      if (userBoard[row][col] !== num && countOnBoard(num) >= 9) return; // 이미 9개 배치된 숫자는 더 놓을 수 없음
      userBoard[row][col] = num;
      notesBoard[row][col].clear(); // 값을 채우면 그 칸의 메모는 의미가 없으므로 정리
    }

    render();
    checkWin();
  }

  function eraseSelected() {
    if (!selected) return;
    const { row, col } = selected;
    if (givenMask[row][col]) return;
    userBoard[row][col] = 0;
    notesBoard[row][col].clear();
    render();
  }

  // 새 문제를 만들지 않고, 현재 문제의 초기 상태(주어진 칸만 남기고)로 되돌림
  function resetBoard() {
    messageEl.textContent = '';
    userBoard = cloneBoard(puzzleBoard);
    notesBoard = Array.from({ length: SIZE }, () => Array.from({ length: SIZE }, () => new Set()));
    startTimer();
    render();
  }

  function findConflicts() {
    const conflicts = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));

    function markGroupConflicts(cells) {
      const seen = {};
      for (const [r, c] of cells) {
        const val = userBoard[r][c];
        if (val === 0) continue;
        if (!seen[val]) seen[val] = [];
        seen[val].push([r, c]);
      }
      for (const val in seen) {
        if (seen[val].length > 1) {
          for (const [r, c] of seen[val]) conflicts[r][c] = true;
        }
      }
    }

    for (let r = 0; r < SIZE; r++) {
      markGroupConflicts(Array.from({ length: SIZE }, (_, c) => [r, c]));
    }
    for (let c = 0; c < SIZE; c++) {
      markGroupConflicts(Array.from({ length: SIZE }, (_, r) => [r, c]));
    }
    for (let br = 0; br < 3; br++) {
      for (let bc = 0; bc < 3; bc++) {
        const cells = [];
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) cells.push([br * 3 + r, bc * 3 + c]);
        }
        markGroupConflicts(cells);
      }
    }

    return conflicts;
  }

  function render() {
    const conflicts = findConflicts();
    const cells = boardEl.children;
    const selectedValue = selected ? userBoard[selected.row][selected.col] : 0;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const cellEl = cells[idx];
        const valueEl = cellEl.querySelector('.value');
        const notesEl = cellEl.querySelector('.notes');

        const val = userBoard[r][c];
        valueEl.textContent = val === 0 ? '' : val;

        if (val === 0 && notesBoard[r][c].size > 0) {
          notesEl.textContent = Array.from(notesBoard[r][c]).sort((a, b) => a - b).join(' ');
        } else {
          notesEl.textContent = '';
        }

        cellEl.classList.toggle('given', givenMask[r][c]);
        cellEl.classList.toggle('conflict', conflicts[r][c]);

        const isSelected = !!selected && selected.row === r && selected.col === c;
        const isPeer = !!selected && !isSelected && (selected.row === r || selected.col === c);
        const isSameNumber = !isSelected && selectedValue !== 0 && val === selectedValue;
        cellEl.classList.toggle('selected', isSelected);
        cellEl.classList.toggle('peer', isPeer);
        cellEl.classList.toggle('same-number', isSameNumber);
      }
    }

    updateNumpadState();
    updateFilledCount();
  }

  function updateNumpadState() {
    for (let n = 1; n <= 9; n++) {
      numberButtons[n].disabled = countOnBoard(n) >= 9;
    }
  }

  function updateFilledCount() {
    let count = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (userBoard[r][c] !== 0) count++;
      }
    }
    filledCountEl.textContent = `채워진 칸: ${count} / 81`;
  }

  function checkWin() {
    const isComplete = userBoard.every((row, r) => row.every((v, c) => v === solutionBoard[r][c]));
    if (isComplete) {
      stopTimer();
      const result = recordCompletion(currentDifficulty, currentStage, elapsedSeconds);
      showWinPopup(result);
    }
  }

  const CONFETTI_COLORS = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bcb', '#845ef7'];

  function spawnConfetti(count) {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      piece.style.animationDuration = `${2.2 + Math.random() * 1.6}s`;
      piece.style.animationDelay = `${Math.random() * 0.6}s`;
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      fragment.appendChild(piece);
    }
    winOverlay.appendChild(fragment);
  }

  function clearConfetti() {
    winOverlay.querySelectorAll('.confetti-piece').forEach(el => el.remove());
  }

  function showWinPopup(result) {
    winStarsEl.textContent = starString(result.stars);
    winNewRecordEl.style.display = result.isNewRecord ? 'block' : 'none';
    winThisTimeEl.textContent = `이번 기록 ${formatTime(result.thisTime)}`;
    winBestTimeEl.textContent = `최고 기록 ${formatTime(result.bestTime)}`;
    spawnConfetti(60);
    winOverlay.classList.add('show');
  }

  function hideWinPopup() {
    winOverlay.classList.remove('show');
    clearConfetti();
  }

  function setMemoMode(on) {
    memoMode = on;
    memoToggleBtn.classList.toggle('active', memoMode);
  }

  document.addEventListener('keydown', (e) => {
    if (!gameScreen.classList.contains('active')) return;
    if (winOverlay.classList.contains('show')) return;
    if (!selected) return;
    if (e.key >= '1' && e.key <= '9') {
      inputNumber(parseInt(e.key, 10));
    } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
      eraseSelected();
    } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
      let { row, col } = selected;
      if (e.key === 'ArrowUp') row = Math.max(0, row - 1);
      if (e.key === 'ArrowDown') row = Math.min(8, row + 1);
      if (e.key === 'ArrowLeft') col = Math.max(0, col - 1);
      if (e.key === 'ArrowRight') col = Math.min(8, col + 1);
      selectCell(row, col);
      e.preventDefault();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', resetBoard);
  memoToggleBtn.addEventListener('click', () => setMemoMode(!memoMode));
  backBtn.addEventListener('click', goHome);
  winNewGameBtn.addEventListener('click', goHome);

  resetProgressBtn.addEventListener('click', () => {
    if (!confirm('모든 기록이 삭제됩니다. 계속할까요?')) return;
    resetProgress();
    currentDifficulty = 'easy';
    renderDifficultySelector();
    renderStageMap();
  });

  let stageMapResizeTimer = null;
  window.addEventListener('resize', () => {
    if (!homeScreen.classList.contains('active')) return;
    clearTimeout(stageMapResizeTimer);
    stageMapResizeTimer = setTimeout(renderStageMap, 150);
  });

  buildBoardDom();
  buildNumpadDom();
  renderDifficultySelector();
  renderStageMap();
})();
</script>

</body>
</html>
